services:
  postgres:
    image: postgres:17-alpine
    container_name: arelts-postgres
    environment:
      POSTGRES_DB: arelts_test
      POSTGRES_USER: arelts
      POSTGRES_PASSWORD: arelts
    ports:
      - '54329:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arelts -d arelts_test']
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data
    tmpfs:
      - /tmp

  mysql:
    image: mysql:8.4
    container_name: arelts-mysql
    environment:
      MYSQL_DATABASE: arelts_test
      MYSQL_USER: arelts
      MYSQL_PASSWORD: arelts
      MYSQL_ROOT_PASSWORD: arelts_root
    ports:
      - '33069:3306'
    command: ['--mysql-native-password=ON']
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u', 'arelts', '-parelts']
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - mysqldata:/var/lib/mysql

volumes:
  pgdata:
  mysqldata:
